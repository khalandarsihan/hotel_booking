<!DOCTYPE html>
<html lang="en" class="">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>{{ title or "Hotel Booking Management System" }}</title>

		<!-- Favicon -->
		<link rel="icon" href="/assets/hotel_booking/images/favicon.ico" type="image/x-icon" />

		<!-- Frappe CSS -->
		<link rel="stylesheet" href="/assets/frappe/css/frappe-web.min.css" />

		<!-- React CSS -->
		<link rel="stylesheet" href="/assets/hotel_booking/css/react-style.css" />

		<!-- Fonts -->
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>

		<!-- Frappe JS -->
		<script src="/assets/frappe/js/lib/jquery/jquery.min.js"></script>
		<script src="/assets/js/frappe-web.min.js"></script>

		{% block head_include %}{% endblock %} {% block style %}{% endblock %}
	</head>
	<body data-path="{{ path or '' }}">
		<!-- Main React App Container -->
		<div id="hotel-booking-root">
			<!-- This is where the React app will render -->
			<!-- If React doesn't load properly, show a message -->
			<div
				id="loading-placeholder"
				style="
					display: flex;
					justify-content: center;
					align-items: center;
					height: 100vh;
					color: #888;
					flex-direction: column;
				"
			>
				<div style="margin-bottom: 20px">
					<svg
						width="40"
						height="40"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
						<polyline points="9 22 9 12 15 12 15 22"></polyline>
					</svg>
				</div>
				<p>Loading Hotel Booking System...</p>
				<p style="font-size: 0.8rem; margin-top: 10px">
					If this message persists, please check console for errors.
				</p>
			</div>
		</div>

		<!-- Page-specific containers (used in individual page templates) -->
		{% block content %}{% endblock %}

		<!-- Common Variables for React -->
		<script>
			// Setup common variables for React
			window.socketPort = "{{ socketio_port or '9000' }}";
			window.frappe = window.frappe || {};
			window.frappe.csrf_token = "{{ frappe.session.csrf_token }}";
			window.currentPath = "{{ path or '' }}";
		</script>

		<!-- React Bundle JS -->
		<script type="text/javascript" src="/assets/hotel_booking/js/react/bundle.js"></script>

		<!-- Page-specific scripts -->
		{% block script %}{% endblock %}

		<!-- Error Handler -->
		<script>
			window.addEventListener("error", function (e) {
				console.error("Application Error:", e.error);
				// Add error handling
			});
		</script>
	</body>
</html>
