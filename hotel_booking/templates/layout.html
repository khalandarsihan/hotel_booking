<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>{{ title or "Hotel Booking Management System" }}</title>

		<!-- Favicon -->
		<link rel="icon" href="/assets/hotel_booking/images/favicon.ico" type="image/x-icon" />

		<!-- Frappe CSS -->
		<link rel="stylesheet" href="/assets/hotel_booking/css/frappe-style.css" />

		<!-- React CSS -->
		<link rel="stylesheet" href="/assets/hotel_booking/css/react-style.css" />

		<!-- Custom CSS -->
		<link rel="stylesheet" href="/assets/hotel_booking/css/style.css" />

		<!-- Fonts -->
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>

		<!-- Frappe JS -->
		<script src="/assets/frappe/js/lib/jquery/jquery.min.js"></script>
		<script src="/assets/js/frappe-web.min.js"></script>

		{% block head_include %}{% endblock %} {% block style %}{% endblock %}
	</head>
	<body data-path="{{ path or '' }}">
		<div id="hotel-booking-root">
			{% block content %}
			<!-- React app will render here -->
			{% endblock %}
		</div>

		<!-- React JS -->
		<script type="text/javascript" src="/assets/hotel_booking/js/react/bundle.js"></script>

		{% block script %}{% endblock %}
	</body>
</html>
