{% extends "templates/layout.html" %} {% block title %}Edit Booking - Hotel Booking Management
System{% endblock %} {% block content %}
<!-- This div will be a target for React's component-specific rendering -->
<div id="edit-booking-root"></div>
{% endblock %} {% block script %}
<script>
	window.socketPort = "{{ socketio_port }}";
	window.currentPage = "edit-booking";
	window.isEditMode = true;

	// Get booking ID from URL parameters
	const urlParams = new URLSearchParams(window.location.search);
	const bookingId = urlParams.get("id");

	if (bookingId) {
		// Make the booking ID available to React components
		window.bookingId = bookingId;
	} else {
		// Add a placeholder message that will be replaced when React loads
		document.getElementById("edit-booking-root").innerHTML =
			'<div class="text-red-500 p-4">Error: No booking ID provided. Please include an ID in the URL.</div>';
	}
</script>
{% endblock %}
