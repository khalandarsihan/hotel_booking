{% extends "templates/layout.html" %} {% block title %}Property Details - Hotel Booking Management
System{% endblock %} {% block content %}
<!-- This div will be a target for React's component-specific rendering -->
<div id="property-details-root"></div>
{% endblock %} {% block script %}
<script>
	window.socketPort = "{{ socketio_port }}";
	window.currentPage = "property-details";

	// Get property ID from URL parameters
	const urlParams = new URLSearchParams(window.location.search);
	const propertyId = urlParams.get("id");

	if (propertyId) {
		// Make the property ID available to React components
		window.propertyId = propertyId;
	} else {
		// Add a placeholder message that will be replaced when React loads
		document.getElementById("property-details-root").innerHTML =
			'<div class="text-red-500 p-4">Error: No property ID provided. Please include an ID in the URL.</div>';
	}
</script>
{% endblock %}
